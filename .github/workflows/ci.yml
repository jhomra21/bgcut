name: ci

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Regenerate Solid 2 RC lock
        run: |
          bun install
          echo "::group::bun.lock diff"
          git diff -- bun.lock
          echo "::endgroup::"
      - run: bun run check
