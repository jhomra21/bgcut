name: ci

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run check


  video-model-probe:
    if: github.event_name == 'pull_request' && github.head_ref == 'research/video-segmentation-bakeoff'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Probe SAM 2.1 Tiny and EdgeTAM with SwiftShader WebGPU
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$RUNNER_TEMP/video-model-probe"
          mkdir -p "$ROOT"

          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [[ -z "$CHROME" ]]; then
            echo "Chrome/Chromium is not installed on this runner." >&2
            exit 1
          fi

          probe_candidate() {
            local candidate="$1"
            local port="$2"
            local output="$ROOT/$candidate"
            local status="infra-failure"
            mkdir -p "$output"

            bun run benchmark:video-segmentation:probe -- "$output" "$port" >"$output/server.log" 2>&1 &
            local server_pid=$!

            for _ in {1..60}; do
              if curl --fail --silent "http://127.0.0.1:$port/" >/dev/null; then
                break
              fi
              sleep 1
            done

            "$CHROME" \
              --headless=new \
              --no-sandbox \
              --enable-unsafe-webgpu \
              --use-webgpu-adapter=swiftshader \
              --enable-dawn-features=allow_unsafe_apis \
              --disable-dawn-features=use_dxc \
              --enable-webgpu-developer-features \
              --use-gpu-in-tests \
              --enable-accelerated-2d-canvas \
              "http://127.0.0.1:$port/?candidate=$candidate" >"$output/chrome.log" 2>&1 &
            local chrome_pid=$!

            for _ in {1..1500}; do
              if [[ -f "$output/video-model-probe.json" ]]; then
                status="compatible"
                cat "$output/video-model-probe.json"
                break
              fi

              if [[ -f "$output/video-model-probe-failure.json" ]]; then
                status="model-failure"
                cat "$output/video-model-probe-failure.json" >&2
                break
              fi

              if ! kill -0 "$chrome_pid" 2>/dev/null; then
                echo "Chrome exited before the $candidate probe completed." >&2
                cat "$output/chrome.log" >&2 || true
                break
              fi

              sleep 1
            done

            kill "$chrome_pid" 2>/dev/null || true
            kill "$server_pid" 2>/dev/null || true

            echo "$candidate $status" | tee "$output/status.txt"
          }

          probe_candidate edgetam 4187
          probe_candidate sam21-tiny 4188

          echo
          echo "Video model compatibility results:"
          cat "$ROOT"/*/status.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: video-model-probe
          path: ${{ runner.temp }}/video-model-probe
          if-no-files-found: error
