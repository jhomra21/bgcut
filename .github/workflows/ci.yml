name: ci

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install
      - name: Commit generated lockfile
        if: github.event_name == 'push' && hashFiles('bun.lock') != ''
        run: |
          if git ls-files --error-unmatch bun.lock >/dev/null 2>&1; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git commit -m "Add Bun lockfile"
          git push origin HEAD:bootstrap
      - run: bun run check
