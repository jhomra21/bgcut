name: cloudflare

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  dry-run:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run cloudflare:dry-run
      - run: bun run cloudflare:runtime:smoke
