name: release-prep

on:
  push:
    branches:
      - release/0.1.0-beta.0

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/0.1.0-beta.0
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Regenerate lockfile metadata
        run: bun install --lockfile-only

      - name: Commit lockfile if changed
        run: |
          if git diff --quiet -- bun.lock; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bun.lock
          git commit -m 'release: refresh beta lockfile'
          git push origin HEAD:release/0.1.0-beta.0
