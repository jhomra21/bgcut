name: anti-slop spacing fix

on:
  push:
    paths:
      - .github/workflows/anti-slop-spacing-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bootstrap
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Apply canonical autofixes
        run: bunx oxlint . --fix
      - name: Verify lint after autofix
        run: bun run lint
      - name: Commit owned-source spacing fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          if git diff --cached --quiet; then
            echo "No spacing changes needed"
            exit 0
          fi
          git commit -m "Apply canonical anti-slop spacing"
          git push origin HEAD:bootstrap
