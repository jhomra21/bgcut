name: refresh-avif-lock

on:
  push:
    branches:
      - feat/avif-input

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/avif-input
          fetch-depth: 0

      - name: Normalize lockfile metadata
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('bun.lock')
          text = path.read_text()
          old = '"name": "bgremove"'
          new = '"name": "bgcut"'

          if old not in text:
              raise SystemExit('Expected bgremove workspace name not found in bun.lock')

          path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit lockfile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bun.lock
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'chore: normalize bgcut lockfile metadata'
          git push origin HEAD:feat/avif-input
