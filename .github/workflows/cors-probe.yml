name: cors-probe

on:
  push:
    branches:
      - infra/model-cors-probe

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe static hosting CORS behavior
        env:
          ORIGIN: http://localhost:5174
        run: |
          set -euxo pipefail

          echo '=== GitHub Pages ==='
          curl --silent --show-error --head \
            --header "Origin: ${ORIGIN}" \
            https://pages.github.com/

          echo '=== raw.githubusercontent.com ==='
          curl --silent --show-error --head \
            --header "Origin: ${ORIGIN}" \
            https://raw.githubusercontent.com/jhomra21/removebg-webgpu/main/AGENTS.md
