name: model-pages-host

on:
  push:
    branches:
      - infra/model-pages-host

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: model-pages-host
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Download and verify optimized model
        env:
          MODEL_URL: https://github.com/jhomra21/removebg-webgpu/releases/download/model-birefnet-lite-512-ort-basic-v1/birefnet-lite-512-ort-basic.onnx
          MODEL_SHA256: 972e25d2a688370b83ea30e9e40a6ecdee3cada6490bec51dbbf540509c5cdb0
        run: |
          set -euxo pipefail
          mkdir -p site/models
          curl --fail --location --retry 3 --output site/models/birefnet-lite-512-ort-basic.onnx "${MODEL_URL}"
          echo "${MODEL_SHA256}  site/models/birefnet-lite-512-ort-basic.onnx" | sha256sum --check -
          printf '%s\n' '{"model":"birefnet-lite-512-ort-basic.onnx","sha256":"972e25d2a688370b83ea30e9e40a6ecdee3cada6490bec51dbbf540509c5cdb0","size_bytes":195860566,"source_revision":"4a3c40c36c94093cc1e724d9ea428b8fa4b57dc7"}' > site/models/manifest.json
          printf '%s\n' '<!doctype html><meta charset="utf-8"><title>removebg-webgpu model assets</title><p>Static model assets for removebg-webgpu.</p>' > site/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify deployed model CORS and size
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          ORIGIN: http://localhost:5174
        run: |
          set -euxo pipefail
          MODEL_URL="${PAGE_URL%/}/models/birefnet-lite-512-ort-basic.onnx"
          headers="$(mktemp)"
          curl --fail --silent --show-error --location --retry 8 --retry-delay 2 \
            --head \
            --header "Origin: ${ORIGIN}" \
            --dump-header "${headers}" \
            --output /dev/null \
            "${MODEL_URL}"
          cat "${headers}"
          grep -Eiq '^access-control-allow-origin: \*' "${headers}"
          grep -Eiq '^accept-ranges: bytes' "${headers}"
          grep -Eiq '^content-length: 195860566' "${headers}"
          echo "MODEL_PAGES_URL=${MODEL_URL}"
