name: vendor anti-slop

on:
  push:
    paths:
      - .github/workflows/vendor-anti-slop.yml

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bootstrap
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Vendor pinned upstream source
        shell: bash
        run: |
          set -euo pipefail
          upstream_sha=c44ef22ca116d0ba62a3ff663a0bd13a3f3fa40b
          git clone --quiet https://github.com/dmmulroy/anti-slop.git /tmp/anti-slop
          git -C /tmp/anti-slop checkout --quiet "$upstream_sha"

          rm -rf tools/oxlint/anti-slop
          mkdir -p tools/oxlint
          cp -R /tmp/anti-slop/src tools/oxlint/anti-slop

          cat > tools/oxlint/anti-slop/UPSTREAM.md <<'EOF'
          # Upstream provenance

          - Source: https://github.com/dmmulroy/anti-slop
          - Revision: `c44ef22ca116d0ba62a3ff663a0bd13a3f3fa40b`
          - Installed path: `tools/oxlint/anti-slop/`
          - Upstream source copied: `src/`
          - Installed: 2026-09-15
          - Intentional deviations at installation: none

          This directory is vendored project source, following upstream's installation policy. Update it by reviewing upstream changes and preserving any project-local customizations rather than replacing it with an unofficial npm package.
          EOF

          bun remove @victor-software-house/anti-slop

          cat > .oxlintrc.json <<'EOF'
          {
            "$schema": "./node_modules/oxlint/configuration_schema.json",
            "ignorePatterns": [
              ".agent/**",
              ".agents/**",
              ".claude/**",
              ".codex/**",
              ".continue/**",
              ".cursor/**",
              ".gemini/**",
              ".opencode/**",
              ".pi/**",
              ".roo/**",
              ".windsurf/**",
              "dist/**",
              "tools/oxlint/anti-slop/**"
            ],
            "jsPlugins": [
              {
                "name": "anti-slop",
                "specifier": "./tools/oxlint/anti-slop/index.ts"
              },
              {
                "name": "anti-slop-effect",
                "specifier": "./tools/oxlint/anti-slop/effect/index.ts"
              }
            ],
            "rules": {
              "oxc/no-accumulating-spread": "error",
              "anti-slop/no-array-filter-map": "error",
              "anti-slop/no-reduce-accumulator-copy": "error",
              "anti-slop/no-chained-type-assertions": "error",
              "anti-slop/no-conditional-empty-object-spread": "error",
              "anti-slop/no-known-value-widening": "error",
              "anti-slop/no-module-mocking": "error",
              "anti-slop/no-object-parameters": "error",
              "anti-slop/no-reflect-apply": "error",
              "anti-slop/no-reflect-get": "error",
              "anti-slop/no-runtime-typeof": "error",
              "anti-slop/no-shape-in-symbol-names": "error",
              "anti-slop/no-unknown-parameters": "error",
              "anti-slop/no-unknown-returns": "error",
              "anti-slop/no-unknown-type-aliases": "error",
              "anti-slop/no-unsafe-dictionary-type": "error",
              "anti-slop/no-widen-then-assert": "error",
              "anti-slop/require-readable-spacing": "error",
              "anti-slop/require-safety-comment-for-type-assertion": "error",
              "anti-slop-effect/no-manual-effect-error-tag": "error",
              "anti-slop-effect/no-manual-tag-comparison": "error",
              "anti-slop-effect/no-manual-tagged-construction": "error",
              "anti-slop-effect/no-service-constructor-imports": "error",
              "anti-slop-effect/prefer-effect-match": "error"
            }
          }
          EOF

      - name: Commit vendored installation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .oxlintrc.json package.json bun.lock tools/oxlint/anti-slop
          git commit -m "Vendor canonical anti-slop rules"
          git push origin HEAD:bootstrap
