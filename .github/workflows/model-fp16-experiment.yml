name: fp16 model experiment

on:
  push:
    branches:
      - perf/webgpu-fp16-model
    paths:
      - ".github/workflows/model-fp16-experiment.yml"
      - "scripts/model/convert-fp16-experiment.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install pinned ONNX tooling
        run: python -m pip install --disable-pip-version-check --no-cache-dir onnx==1.19.0 onnxruntime==1.30.0

      - name: Download validated production model
        run: |
          mkdir -p artifacts
          curl --fail --location --retry 3 \
            --output artifacts/production.onnx \
            "https://github.com/jhomra21/bgcut/releases/download/model-birefnet-lite-512-ort-basic-webgpu-v2/birefnet-lite-512-ort-basic-webgpu-v2.onnx"
          test "$(stat -c %s artifacts/production.onnx)" = "195872736"
          echo "4461109672dda07a054892aef076b5fcc5fc40bbc91f51a357a7593c7f45ad9c  artifacts/production.onnx" | sha256sum --check -

      - name: Convert production graph to FP16 internals
        run: |
          python scripts/model/convert-fp16-experiment.py \
            artifacts/production.onnx \
            artifacts/birefnet-lite-512-ort-basic-webgpu-v2-fp16.onnx \
            artifacts/fp16-model-report.json

      - name: Upload FP16 candidate
        uses: actions/upload-artifact@v4
        with:
          name: bgcut-webgpu-v2-fp16
          path: |
            artifacts/birefnet-lite-512-ort-basic-webgpu-v2-fp16.onnx
            artifacts/fp16-model-report.json
          compression-level: 0
          if-no-files-found: error
