name: deploy-web

on:
  push:
    branches:
      - main
    paths:
      - deploy/production.json
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact accepted commit SHA to deploy
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: bgcut-web-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve accepted source
        id: source
        shell: bash
        env:
          DISPATCH_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            SOURCE_SHA="$DISPATCH_SHA"
          else
            SOURCE_SHA="$(node -p "require('./deploy/production.json').source_sha")"
          fi

          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Expected a full 40-character commit SHA, got: $SOURCE_SHA" >&2
            exit 1
          fi

          git cat-file -e "$SOURCE_SHA^{commit}"

          if ! git merge-base --is-ancestor "$SOURCE_SHA" "$GITHUB_SHA"; then
            echo "$SOURCE_SHA is not an ancestor of the deployment trigger commit $GITHUB_SHA." >&2
            exit 1
          fi

          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          git checkout --detach "$SOURCE_SHA"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Require Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail

          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run production gates
        run: |
          bun run check
          bun run cloudflare:dry-run

      - name: Ensure production R2 bucket
        shell: bash
        run: |
          set -euo pipefail

          if bunx wrangler@4.133.0 r2 bucket info bgcut-models >/dev/null 2>&1; then
            echo "R2 bucket bgcut-models already exists."
          else
            bunx wrangler@4.133.0 r2 bucket create bgcut-models
          fi

      - name: Prepare validated model
        run: bun run model:prepare

      - name: Upload production R2 assets
        shell: bash
        run: |
          set -euo pipefail

          CACHE_CONTROL='public, max-age=31536000, immutable'

          bunx wrangler@4.133.0 r2 object put             bgcut-models/birefnet-lite-512-ort-basic-webgpu-v2.onnx             --file public/models/birefnet-lite-512-ort-basic-webgpu-v2.onnx             --content-type application/octet-stream             --cache-control "$CACHE_CONTROL"             --remote

          bunx wrangler@4.133.0 r2 object put             bgcut-models/ort-wasm-simd-threaded.asyncify.wasm             --file node_modules/onnxruntime-web/dist/ort-wasm-simd-threaded.asyncify.wasm             --content-type application/wasm             --cache-control "$CACHE_CONTROL"             --remote

          bunx wrangler@4.133.0 r2 object put             bgcut-models/ort-wasm-simd-threaded.wasm             --file node_modules/onnxruntime-web/dist/ort-wasm-simd-threaded.wasm             --content-type application/wasm             --cache-control "$CACHE_CONTROL"             --remote

          bunx wrangler@4.133.0 r2 object put             bgcut-models/ort-wasm-simd-threaded.mjs             --file node_modules/onnxruntime-web/dist/ort-wasm-simd-threaded.mjs             --content-type text/javascript             --cache-control "$CACHE_CONTROL"             --remote

      - name: Verify production R2 assets
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED_MODEL_SHA='4461109672dda07a054892aef076b5fcc5fc40bbc91f51a357a7593c7f45ad9c'

          REMOTE_MODEL_SHA="$(
            bunx wrangler@4.133.0 r2 object get               bgcut-models/birefnet-lite-512-ort-basic-webgpu-v2.onnx               --remote               --pipe |
              sha256sum |
              awk '{print $1}'
          )"

          test "$REMOTE_MODEL_SHA" = "$EXPECTED_MODEL_SHA"

          for file in             ort-wasm-simd-threaded.asyncify.wasm             ort-wasm-simd-threaded.wasm             ort-wasm-simd-threaded.mjs
          do
            LOCAL_SHA="$(sha256sum "node_modules/onnxruntime-web/dist/$file" | awk '{print $1}')"
            REMOTE_SHA="$(
              bunx wrangler@4.133.0 r2 object get "bgcut-models/$file" --remote --pipe |
                sha256sum |
                awk '{print $1}'
            )"

            test "$LOCAL_SHA" = "$REMOTE_SHA"
            echo "Verified $file."
          done

      - name: Deploy bgcut.dev
        run: |
          bun run build:cloudflare
          bunx wrangler@4.133.0 deploy

      - name: Verify production routes
        shell: bash
        run: |
          set -euo pipefail

          wait_for_url() {
            local url="$1"

            for attempt in {1..30}; do
              if curl --fail --silent --show-error --head "$url" >/tmp/bgcut-headers; then
                return 0
              fi

              echo "Waiting for $url ($attempt/30)..."
              sleep 10
            done

            echo "Timed out waiting for $url." >&2
            return 1
          }

          wait_for_url "https://bgcut.dev/"
          wait_for_url "https://bgcut.dev/models/birefnet-lite-512-ort-basic-webgpu-v2.onnx"

          wait_for_url "https://bgcut.dev/runtime/ort-wasm-simd-threaded.asyncify.wasm"
          grep -iq '^content-type: application/wasm' /tmp/bgcut-headers

          wait_for_url "https://bgcut.dev/runtime/ort-wasm-simd-threaded.wasm"
          grep -iq '^content-type: application/wasm' /tmp/bgcut-headers

          wait_for_url "https://bgcut.dev/runtime/ort-wasm-simd-threaded.mjs"
          grep -Eiq '^content-type: (text|application)/javascript' /tmp/bgcut-headers

      - name: Record deployment
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        run: |
          {
            echo "## bgcut.dev deployment"
            echo
            echo "- Source: `$SOURCE_SHA`"
            echo "- Worker: `bgcut-web`"
            echo "- Domain: https://bgcut.dev"
            echo "- R2 bucket: `bgcut-models`"
          } >> "$GITHUB_STEP_SUMMARY"
