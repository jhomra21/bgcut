name: rename-bgremove

on:
  push:
    branches:
      - chore/rename-bgremove

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/rename-bgremove
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Apply canonical bgremove naming
        run: |
          python3 - <<'PY'
          from pathlib import Path

          for raw_path in __import__('subprocess').check_output(
              ['git', 'grep', '-Il', 'removebg-webgpu'], text=True
          ).splitlines():
              path = Path(raw_path)
              text = path.read_text()
              path.write_text(text.replace('removebg-webgpu', 'bgremove'))

          readme = Path('README.md')
          text = readme.read_text()
          old = '''## Experimental native CLI

This branch also contains an experimental terminal path. The public binary/package name is intentionally not finalized yet; several obvious background-removal names are already used by existing tools. Run the local entrypoint with Bun while the command name is being chosen:

```sh
bun run cli -- photo.jpg
bun run cli -- photo.jpg --png
bun run cli -- photo.jpg -png
bun run cli -- photo.jpg --webp
bun run cli -- photo.jpg -webp -o portrait.webp
bun run cli -- photo.jpg -o portrait.png
```
'''
          new = '''## Native CLI

The command is `bgremove`. The package stays private until its first explicit release, but the CLI name and package metadata are now canonical:

```sh
bgremove photo.jpg
bgremove photo.jpg --png
bgremove photo.jpg -png
bgremove photo.jpg --webp
bgremove photo.jpg -webp -o portrait.webp
bgremove photo.jpg -o portrait.png
```

From a source checkout, `bun run cli -- ...` runs the same entrypoint without installing the package binary.
'''
          if old not in text:
              raise SystemExit('README CLI block did not match expected source')
          readme.write_text(text.replace(old, new))
          PY

      - name: Regenerate Bun lock metadata
        run: bun install --lockfile-only

      - name: Verify rename
        run: |
          if git grep -n 'removebg-webgpu'; then
            echo 'stale removebg-webgpu references remain' >&2
            exit 1
          fi
          git diff --check

      - name: Commit generated rename
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md BENCHMARKS.md IMPROVEMENTS.md index.html src/App.tsx bun.lock
          git commit -m 'chore: finish bgremove rename'
          git push origin HEAD:chore/rename-bgremove
